name: serendib_guide
description: Complete offline travel guide for Sri Lanka with 300+ attractions, offline maps, and trip planning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Images & UI
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

  # State Management
  provider: ^6.1.1

  # Localization
  intl: ^0.18.1

  # Monetization
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.11

  # Storage & Utils
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo/
    - assets/images/attractions/
    - assets/images/illustrations/
    - assets/data/
    - assets/database/
    - assets/map_tiles/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Light.ttf
          weight: 300
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo/icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/logo/icon_foreground.png"

flutter_native_splash:
  color: "#1565C0"
  image: assets/images/logo/splash.png
  android_12:
    image: assets/images/logo/splash_android12.png
    color: "#1565C0"
